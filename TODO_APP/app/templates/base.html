<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Task Master{% endblock %}</title>
    <link rel="stylesheet" href="{{url_for('static',filename='css/styles.css')}}">
</head>
<body>
    <header>
        <div class="container header-content">
            <div class="logo-container">
                <img src="{{ url_for('static', filename='img/logo.png') }}" class="logo">
                <span class="app-name">Task Master</span>
            </div>
            <nav>
                <a href="{{ url_for('tasks.view_tasks')}}">Home</a>
                <a href="{{ url_for('register.register')}}">Register</a>
                {% if 'user' in session %}
                    <a href="{{ url_for('auth.logout')}}">Logout</a>
                {% else %}
                    <a href="{{ url_for('auth.login')}}">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>
    <main class="container">
        {% with messages= get_flashed_messages(with_categories=True) %}
            {% for category,message in messages %}
                <div class="flash {{category}}">{{message}}</div> 
            {% endfor %}
        {% endwith %}
        {% block content %}

         {% endblock %}
    </main>
    <footer>
        <div class="container">
            <p>&copy; {{2026}} flask App Task Master</p>
        </div>
    </footer>
</body>
</html>
